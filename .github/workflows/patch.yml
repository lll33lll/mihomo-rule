name: patch

# 一次性补丁流程：改完、校验完就把自己和补丁脚本一起删掉。
# 路径故意避开 build 工作流的 paths，避免两个 job 同时往同一分支推产物。
on:
  push:
    paths:
      - '.github/_patch.js'

permissions:
  contents: write

concurrency:
  group: build-refs/heads/main
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 调整策略组顺序
        run: node .github/_patch.js

      - name: 校验结果指纹（应与本地验证过的字节一致）
        run: |
          echo '78a46e2d29726f4ead6fafcce239138de1c6a02b3604d985ddbf8df4d7361b1b  Script/override.js' | sha256sum -c -

      - name: 脚本自检
        run: node test/run.js

      - name: 确认自动生成区未受影响（零 diff）
        run: |
          cp Script/override.js "$RUNNER_TEMP/before.js"
          node tools/sync-upstream.js --offline
          diff -u "$RUNNER_TEMP/before.js" Script/override.js

      - name: 生成配置文件版
        run: node tools/gen-config.js

      - name: 用 mihomo 内核校验两份产物
        run: bash tools/verify.sh

      - name: 提交并移除临时文件
        run: |
          rm .github/_patch.js .github/workflows/patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: 「全部节点」组移到「节点选择」后面，手动挑节点不用划到底'
          git push
