name: build

on:
  push:
    paths:
      - 'Script/override.js'
      - 'tools/**'
      - 'test/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: write

# 连续提交时只保留最新一次，避免两个 job 同时往同一分支推产物
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 确保上游快照存在（首次运行或快照丢失时抓一次）
        run: |
          if [ ! -f test/upstream-snapshot.yaml ]; then
            echo '快照不在，先抓一次上游'
            node tools/sync-upstream.js
          fi

      - name: 脚本自检
        run: node test/run.js

      - name: 确认自动生成区与上游快照一致（防手改）
        run: |
          cp Script/override.js "$RUNNER_TEMP/before.js"
          node tools/sync-upstream.js --offline
          if ! diff -q "$RUNNER_TEMP/before.js" Script/override.js; then
            echo '::error::Script/override.js 的 AUTO-GENERATED 区与 test/upstream-snapshot.yaml 不一致。'
            echo '::error::那一块由 tools/sync-upstream.js 生成，请改快照或重跑同步，不要手改。'
            diff -u "$RUNNER_TEMP/before.js" Script/override.js | head -40
            exit 1
          fi

      - name: 生成配置文件版
        run: node tools/gen-config.js

      - name: 用 mihomo 内核校验两份产物
        run: bash tools/verify.sh

      - name: 同步产物
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Config/config.yaml test/upstream-snapshot.yaml Script/override.js
          git diff --staged --quiet && echo '无变化' && exit 0
          git commit -m 'chore: 同步生成产物'
          git push
