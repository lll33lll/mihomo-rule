# ==================================================================
#  mihomo 分流配置（配置文件版）
#  由 tools/gen-config.js 从 Script/override.js 生成，别直接改这里；
#  改完脚本重跑一次生成即可，两份产物的规则永远一致。
#
#  用之前只要做一件事：把机场订阅链接填进下面 proxy-providers 的 url。
#  想改策略组 / 地区 / 开关，用覆写脚本版，功能更全。
# ==================================================================

# --- 机场订阅：url 填在单引号里，可整段复制来添加第二、第三个机场 ---
proxy-providers:
  机场一:
    type: http
    url: '' # ← 订阅链接填这里
    interval: 86400
    proxy: DIRECT # 更新订阅走直连，避免节点全挂时更不了
    path: ./providers/sub1.yaml
    exclude-type: 'direct|reject|rematch'
    exclude-filter: '群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|地址|频道|电报|无法|说明|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|优惠|福利|邀请|好友|失联|剩余|公益|发布|通路|登录|禁止|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|重置|以下|拒绝|⚠️|@|t\.me\/\+|\bexpire\b|\bhttps?:\/\/|\.com|\btraffic\b|\bused?\b|\btotal\b|\bpanel\b|\bchannel\b' # 过滤机场塞的广告 / 到期提示假节点
    health-check: { enable: true, url: http://www.gstatic.com/generate_204, interval: 600, lazy: true }
    override: { udp: true, additional-prefix: 'A | ' } # udp 补上，多机场时防重名

#  机场二:
#    type: http
#    url: ''
#    interval: 86400
#    proxy: DIRECT
#    path: ./providers/sub2.yaml
#    exclude-type: 'direct|reject|rematch'
#    health-check: { enable: true, url: http://www.gstatic.com/generate_204, interval: 600, lazy: true }
#    override: { udp: true, additional-prefix: 'B | ' }

# --- 内置直连节点 ---
proxies:
  - name: 🟢 直连
    type: direct
    udp: true

# --- 基础设置 ---
mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 30
global-ua: clash.meta
geodata-mode: false
find-process-mode: strict
external-controller: '127.0.0.1:9090'
external-ui: ui
external-ui-url: 'https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip'

profile: { store-selected: true, store-fake-ip: true }

ntp: { enable: true, write-to-system: false, server: ntp.aliyun.com, port: 123, interval: 60 }

# --- 域名嗅探：修正走 IP 直连时拿不到域名的连接 ---
sniffer:
  enable: true
  sniff:
    HTTP: { ports: [80, 8080-8880], override-destination: true }
    TLS: { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }
  force-domain: [+.v2ex.com]
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - +.push.apple.com
    - +.apple.com
    - +.wechat.com
    - +.wechatapp.com
    - +.qq.com
    - +.qpic.cn
    - +.vivox.com
    - +.oray.com
    - +.sunlogin.net

# --- TUN：路由器 / OpenWrt 透明代理场景把 enable 改成 false ---
tun:
  enable: true
  stack: gvisor
  mtu: 9000
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack: ['any:53', 'tcp://any:53']

# --- DNS：国外域名走国外 DoH，国内域名与节点域名交给国内 DNS ---
#  机场必须用私有 DNS 才能解析节点域名时，把它填进 proxy-server-nameserver
dns:
  enable: true
  ipv6: true
  prefer-h3: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - 'rule-set:fakeip_filter_domain,game_cn_domain,bank_cn_domain,wechat_domain,ai_cn_domain,NetEaseMusic_domain,fcm_domain,alibaba_domain,media_cn_domain,xiaomi_domain,steam_cn_domain,115_domain,aliyun_domain,direct_domain,apple_cn_domain,apple_firmware_domain,iptv_domain,private_domain,cn_domain'
    - +.lan
    - +.local
  default-nameserver: [119.29.29.29, 223.5.5.5]
  proxy-server-nameserver: [223.5.5.5, 119.29.29.29, system]
  direct-nameserver: [system, 223.5.5.5, 119.29.29.29]
  nameserver: ['https://dns.google/dns-query', 'https://dns.cloudflare.com/dns-query']
  fake-ip-range6: '2001:480:abcd::1/64'
  nameserver-policy:
    'www.gstatic.com,cp.cloudflare.com,connectivitycheck.platform.hicloud.com': [223.5.5.5, 119.29.29.29]

hosts:
  dns.google: [8.8.8.8, 8.8.4.4]
  dns.cloudflare.com: [1.1.1.1, 1.0.0.1]
  services.googleapis.cn: services.googleapis.com
  +.mcdn.bilivideo.com: [0.0.0.0]
  +.mcdn.bilivideo.cn: [0.0.0.0]

