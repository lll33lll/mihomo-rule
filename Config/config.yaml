# ==================================================================
#  mihomo 分流配置（配置文件版）
#  由 tools/gen-config.js 从 Script/override.js 生成，不要直接改这里，
#  改完脚本重新跑一次生成即可，两份产物的规则永远一致。
#
#  用之前只要做一件事：把机场订阅链接填进下面 proxy-providers 的 url。
#  想改策略组 / 地区 / 开关，建议直接用覆写脚本版，功能更全。
# ==================================================================

# --- 机场订阅：url 填在单引号里，可复制整段来添加第二、第三个机场 ---
proxy-providers:
  机场一:
    type: http
    url: '' # ← 订阅链接填这里
    interval: 86400
    proxy: DIRECT # 更新订阅走直连，避免节点全挂时更不了
    path: ./providers/sub1.yaml
    exclude-type: 'direct|reject|rematch'
    exclude-filter: '群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|地址|频道|电报|无法|说明|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|优惠|福利|邀请|好友|失联|剩余|公益|发布|通路|登录|禁止|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|重置|以下|⚠️|@|t\.me\/\+|\bexpire\b|\bhttps?:\/\/|\.com|\btraffic\b' # 过滤机场塞的广告 / 到期提示假节点
    health-check: { enable: true, url: https://cp.cloudflare.com/generate_204, interval: 600, lazy: true }
    override: { additional-prefix: 'A | ' } # 多机场时防止节点重名

#  机场二:
#    type: http
#    url: ''
#    interval: 86400
#    proxy: DIRECT
#    path: ./providers/sub2.yaml
#    exclude-type: 'direct|reject|rematch'
#    health-check: { enable: true, url: https://cp.cloudflare.com/generate_204, interval: 600, lazy: true }
#    override: { additional-prefix: 'B | ' }

# --- 直连节点，供「直连」组切换 IP 栈 ---
proxies:
  - name: 直连 · 双栈
    type: direct
  - name: 直连 · IPv4优先
    type: direct
    ip-version: ipv4-prefer
  - name: 直连 · IPv6优先
    type: direct
    ip-version: ipv6-prefer
  - name: 直连 · 仅IPv4
    type: direct
    ip-version: ipv4

# --- 基础设置 ---
mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 30
find-process-mode: strict
external-controller: '127.0.0.1:9090'
external-ui: ui
external-ui-url: 'https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip'

profile: { store-selected: true, store-fake-ip: true }

ntp: { enable: true, write-to-system: false, server: ntp.aliyun.com, port: 123, interval: 60 }

# --- 域名嗅探：修正走 IP 直连时拿不到域名的连接 ---
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP: { ports: [80, 8080-8880], override-destination: true }
    TLS: { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }
  skip-domain: [+.push.apple.com, +.apple.com, Mijia Cloud, dlg.io.mi.com]

# --- TUN：手机客户端与路由器透明代理场景可把 enable 改成 false ---
tun:
  enable: true
  stack: mixed
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack: ['any:53', 'tcp://any:53']
  mtu: 1500

# --- DNS：国外域名只经代理用 DoH 解析，国内域名交给国内 DNS，无泄露 ---
#  机场用私有 DNS 才能解析节点域名时，把它填进 proxy-server-nameserver
dns:
  enable: true
  ipv6: true
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-filter: ['rule-set:private', 'rule-set:fakeip_filter', 'rule-set:geolocation-cn', +.lan, +.local]
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver: ['https://223.5.5.5/dns-query#DIRECT', 'https://1.12.12.12/dns-query#DIRECT']
  nameserver: ['https://cloudflare-dns.com/dns-query#默认代理', 'https://dns.google/dns-query#默认代理']
  nameserver-policy:
    'rule-set:cn_site,private': [223.5.5.5, 119.29.29.29]
    +.jsdelivr.net: [223.5.5.5, 119.29.29.29]
  direct-nameserver: [system, 223.5.5.5, 119.29.29.29]

hosts:
  cloudflare-dns.com: [1.1.1.1, 1.0.0.1]
  dns.google: [8.8.8.8, 8.8.4.4]
  services.googleapis.cn: services.googleapis.com
  +.mcdn.bilivideo.com: [0.0.0.0]
  +.mcdn.bilivideo.cn: [0.0.0.0]
  +.szbdyd.com: [0.0.0.0]

