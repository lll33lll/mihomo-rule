# --- 策略组 ---
proxy-groups:
  - name: 默认代理
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 600
    timeout: 3000
    lazy: true
    max-failed-times: 3
    expected-status: '204'
    type: select
    proxies: [香港, 日本, 美国, 新加坡, 其他节点, 手动选择, 自动选择, 负载均衡]
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png'
  - name: 手动选择
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 600
    timeout: 3000
    lazy: true
    max-failed-times: 3
    expected-status: '204'
    type: select
    include-all: true
    exclude-type: DIRECT
    exclude-filter: '群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|地址|频道|电报|无法|说明|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|优惠|福利|邀请|好友|失联|剩余|公益|发布|通路|登录|禁止|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|重置|以下|⚠️|@|t\.me\/\+|\bexpire\b|\bhttps?:\/\/|\.com|\btraffic\b'
